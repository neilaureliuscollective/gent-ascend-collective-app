name: Obsidian visual verification
on:
  push:
    branches: [feat/obsidian-intelligence, feat/imperial-emerald-obsidian-20261012, main]
  pull_request:
    paths:
      - 'src/app/**'
      - 'src/platform/visual/**'
      - 'tests/browser/**'
      - 'tests/materials/**'
      - 'tests/fixtures/creation-materials.ts'
      - 'playwright.materials.config.ts'
      - 'playwright.charcoal.config.ts'
      - 'scripts/capture-charcoal-routes.mjs'
      - '.github/workflows/obsidian-visual.yml'
concurrency:
  group: obsidian-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/install-ffmpeg
      - run: npm ci
      - run: npm run check
      - run: npm run db:ledger
      - run: npx playwright install --with-deps chromium
      - name: Verify product reflow, materials and preserved interactions
        run: >-
          npx playwright test
          tests/browser/founder-office.spec.ts
          tests/browser/imperial-emerald.spec.ts
          tests/browser/obsidian-intelligence.spec.ts
          tests/browser/luminous-obsidian.spec.ts
          tests/browser/imperial-tools.spec.ts
          tests/browser/talk-layout.spec.ts
          tests/browser/shell.spec.ts
          tests/browser/imperial-obsidian.spec.ts
          tests/browser/imperial-steel.spec.ts
          tests/browser/imperial-ascend.spec.ts
          tests/browser/aether-brand.spec.ts
          tests/browser/aurelius.spec.ts
          tests/browser/company-work.spec.ts
          tests/browser/company-room.spec.ts
          tests/browser/missions.spec.ts
          --workers=2
      - name: Verify creation glass and document width with labelled API fixtures
        run: npx playwright test --config playwright.materials.config.ts --output=test-results/creation-materials
      - name: Verify screenshot hashes, source commit and finalized videos
        run: node scripts/verify-creation-material-evidence.mjs
      - name: Verify all app sections with matched charcoal viewports
        run: |
          npx playwright test --config playwright.charcoal.config.ts --output=test-results/charcoal-checks
          node scripts/charcoal-coverage-report.mjs
      - name: Export compact rendered review excerpts
        if: always()
        run: node scripts/imperial-emerald-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obsidian-rendered-evidence
          path: test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obsidian-review-images
          path: |
            test-results/emerald-*-390.png
            test-results/emerald-*-1440.png
            test-results/obsidian--*-390.png
            test-results/obsidian--*-1440.png
            test-results/imperial-obsidian-studio-*.png
          if-no-files-found: ignore
  production-entry:
    if: github.ref == 'refs/heads/main'
    needs: visual
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the actual custom production domain
        run: npx playwright test --config playwright.production.config.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obsidian-live-production-evidence
          path: test-results
          if-no-files-found: ignore
