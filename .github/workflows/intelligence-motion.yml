name: Intelligence motion release verification
on:
  push:
    branches: [release/intelligence-motion-20261012, main]
  pull_request:
    paths:
      - 'src/components/intelligence-motion/**'
      - 'src/platform/visual/**'
      - 'src/components/aurelius/**'
      - 'src/components/companies/**'
      - 'src/components/live/**'
      - 'src/domains/intelligence/**'
      - 'tests/browser/intelligence-motion*'
      - '.github/workflows/intelligence-motion.yml'
permissions:
  contents: read
jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run db:ledger
      - run: npx playwright install --with-deps chromium
      - name: Render all operation states, actual Talk and Studio, and lifecycle checks
        run: >-
          npx playwright test
          tests/browser/intelligence-motion.spec.ts
          tests/browser/intelligence-motion-integration.spec.ts
          tests/browser/intelligence-motion-release.spec.ts
          tests/browser/talk-layout.spec.ts
          tests/browser/company-room.spec.ts
          tests/browser/company-work.spec.ts
          tests/browser/founder-office.spec.ts
          tests/browser/live-voice.spec.ts
          tests/browser/account-claim.spec.ts
          --workers=2
      - name: Compact synthetic rendered review for connector inspection
        if: always()
        run: node scripts/intelligence-motion-review.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: intelligence-motion-rendered-evidence
          path: test-results
          if-no-files-found: ignore
