name: Lifestyle acceptance
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'playwright.lifestyle*.ts'
      - '.github/workflows/lifestyle.yml'
  push:
    branches: [feat/lifestyle-reconcile-20261012]
permissions:
  contents: read
jobs:
  lifestyle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run db:ledger
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.lifestyle.config.ts
      - run: npx playwright test --config playwright.lifestyle-app.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifestyle-evidence
          path: |
            docs/evidence/lifestyle
            test-results
          if-no-files-found: ignore
