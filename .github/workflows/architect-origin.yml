name: Architect Origin acceptance
on:
  push:
    branches: ['feat/architect-origin-*', 'feat/architect-immersive-*']
  pull_request:
    paths: ['src/domains/architect-origin/**', 'src/domains/architect-construct/**', 'src/domains/architect-tools/**', 'src/domains/architect-apps/**', 'src/components/architect-origin/**', 'src/app/**/architect/**', 'src/app/api/architect-origin/**', 'src/app/api/architect-construct/**', 'src/app/api/architect-tools/**', 'src/app/api/architect-apps/**', 'src/app/api/internal/architect-construct/**', 'tests/*architect-origin*', 'tests/*architect-construct*', 'tests/*architect-tools*', 'tests/*architect-apps*', 'tests/**/architect-origin*', 'tests/**/architect-apps*', 'supabase/migrations/*architect_origin*.sql', 'supabase/migrations/*architect_construct.sql', 'supabase/migrations/*architect_apps*.sql', 'deploy/architect-apps/**', '.github/workflows/architect-origin.yml', 'next.config.ts']
concurrency:
  group: origin-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - uses: ./.github/actions/install-ffmpeg
      - run: npm ci
      - run: npm run db:ledger
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architect-construct-host-receipts
          path: |
            docs/evidence/architect-construct/host-active-cancel-receipt.json
            docs/evidence/architect-construct/host-isolation-receipt.json
          if-no-files-found: warn
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.origin.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: architect-origin-browser-evidence, path: test-results, if-no-files-found: ignore}
  local-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Start local Supabase
        run: |
          npx supabase start || {
            echo 'supabase start failed; retrying after stop'
            npx supabase stop --no-backup || true
            sleep 8
            npx supabase start
          }
      - run: npx supabase db reset --local
      - run: node scripts/dev-setup.mjs --running
      - run: node scripts/architect-origin-auth-smoke.mjs
      - run: node scripts/architect-construct-auth-smoke.mjs
      - run: node scripts/architect-construct-durable-smoke.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/architect-apps-auth-smoke.mjs
      - name: Prepare pinned toolchain, worker image and uid-1000 work root
        env:
          ARCHITECT_APPS_REQUIRE_ISOLATION: 'true'
          ARCHITECT_APPS_WORK_ROOT: /tmp/architect-apps-work
        run: node scripts/architect-apps-prepare-runtime.mjs
      - name: Prove the packaged worker can write and compile
        env:
          ARCHITECT_APPS_REQUIRE_ISOLATION: 'true'
          ARCHITECT_APPS_WORK_ROOT: /tmp/architect-apps-work
          ARCHITECT_APPS_IMAGE: aethelios-architect-apps:2026-10-15.1
        run: |
          node scripts/architect-apps-packaged-worker.mjs --prove-write
          node scripts/architect-apps-packaged-worker.mjs --prove-compile
      - name: Connected Apps journey through the packaged worker
        env:
          ARCHITECT_APPS_PACKAGED_WORKER: 'true'
          ARCHITECT_APPS_WORK_ROOT: /tmp/architect-apps-work
          ARCHITECT_APPS_REQUIRE_ISOLATION: 'true'
        run: npx playwright test --config playwright.origin-auth.config.ts
      - name: Publish connected-journey evidence
        if: always()
        run: |
          mkdir -p docs/evidence/architect-apps test-results/architect-apps-connected
          video="$(find test-results -name '*.webm' -not -path '*/architect-apps-connected/*' | head -n 1 || true)"
          if [ -n "$video" ]; then
            cp "$video" docs/evidence/architect-apps/connected-journey.webm
            cp "$video" test-results/architect-apps-connected/connected-journey.webm
          fi
          for shot in docs/evidence/architect-apps/workbench-*.png docs/evidence/architect-apps/connected-journey.json; do
            if [ -f "$shot" ]; then
              cp "$shot" test-results/architect-apps-connected/
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architect-origin-auth-evidence
          path: |
            test-results
            test-results/architect-apps-connected
            docs/evidence/architect-apps/workbench-*.png
            docs/evidence/architect-apps/connected-journey.json
            docs/evidence/architect-apps/connected-journey.webm
            docs/evidence/architect-apps/runtime-receipt.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architect-apps-connected-journey
          path: |
            docs/evidence/architect-apps/workbench-*.png
            docs/evidence/architect-apps/connected-journey.json
            docs/evidence/architect-apps/connected-journey.webm
            test-results/architect-apps-connected
          if-no-files-found: ignore
      - if: always()
        run: npx supabase stop --no-backup
