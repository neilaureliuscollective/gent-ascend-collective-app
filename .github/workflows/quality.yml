name: Quality gates
on: [push, pull_request]
# Push and PR events for the same source branch verify one current head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:ledger
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architect-construct-host-receipts
          path: |
            docs/evidence/architect-construct/host-active-cancel-receipt.json
            docs/evidence/architect-construct/host-isolation-receipt.json
          if-no-files-found: warn
      - run: npx playwright install --with-deps chromium
      - name: Health responsive, ownership and privacy checks
        run: npx playwright test tests/browser/health.spec.ts --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-rendered-evidence
          path: test-results/health-*/health-*.png
          if-no-files-found: ignore
      - name: Founder Office responsive and recovery checks
        run: npx playwright test tests/browser/founder-office.spec.ts --workers=2
      - name: Current Command and identity route contracts
        run: >-
          npx playwright test tests/browser/daily.spec.ts tests/browser/command.spec.ts
          tests/browser/command-living.spec.ts tests/browser/appearance.spec.ts
          tests/browser/brand.spec.ts tests/browser/aethelios-identity.spec.ts
          tests/browser/company-platform.spec.ts tests/browser/public-world.spec.ts
          tests/browser/installed-app.spec.ts tests/browser/estate-journey.spec.ts
          tests/browser/estate-motion.spec.ts tests/browser/direct-home.spec.ts
          tests/browser/orb.spec.ts tests/browser/pilot.spec.ts
          tests/browser/lifestyle-phase-one.spec.ts --workers=2
      - name: Live policy and current commerce regressions
        run: >-
          npx playwright test tests/browser/ascend-mirror.spec.ts
          tests/browser/collection-world.spec.ts tests/browser/commerce-discovery.spec.ts --workers=2
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-evidence
          path: |
            test-results/performance*/**/*.png
            test-results/performance*/**/error-context.md
          if-no-files-found: ignore
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: |
          npx supabase start || {
            echo 'supabase start failed; retrying after stop'
            npx supabase stop --no-backup || true
            sleep 8
            npx supabase start
          }
      - run: npx supabase db reset --local
      - run: node scripts/dev-setup.mjs --running
      - run: npx supabase db advisors --local --type security --level warn --fail-on none
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - name: Real authenticated Founder Office persistence journey
        run: npx playwright test --config playwright.founder.config.ts tests/founder/founder-office.spec.ts
      - run: npm run test:founder
      - name: Architect Apps Auth/PostgREST mutation smoke
        run: node scripts/architect-apps-auth-smoke.mjs
      - if: always()
        run: npx supabase stop --no-backup
  apps-isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare pinned toolchain, worker image and uid-1000 work root
        env:
          ARCHITECT_APPS_REQUIRE_ISOLATION: 'true'
          ARCHITECT_APPS_WORK_ROOT: /tmp/architect-apps-work
        run: node scripts/architect-apps-prepare-runtime.mjs
      - name: Required isolated compile, packaged worker topology and compiled journey
        env:
          ARCHITECT_APPS_REQUIRE_ISOLATION: 'true'
          ARCHITECT_APPS_PREVIEW_SECRET: isolate-preview-secret-key
          ARCHITECT_APPS_WORK_ROOT: /tmp/architect-apps-work
          APP_ENV: local
        run: npx vitest run tests/architect-apps-isolate.test.ts tests/architect-apps-compiled-journey.test.ts tests/architect-apps-commission.test.ts tests/architect-apps-worker-image.test.ts tests/architect-apps-preview-sessions.test.ts --reporter=dot
      - name: Prove the packaged worker can write, compile and map host paths
        env:
          ARCHITECT_APPS_REQUIRE_ISOLATION: 'true'
          ARCHITECT_APPS_WORK_ROOT: /tmp/architect-apps-work
          ARCHITECT_APPS_IMAGE: aethelios-architect-apps:2026-10-15.1
        run: |
          node scripts/architect-apps-packaged-worker.mjs --prove-write
          node scripts/architect-apps-packaged-worker.mjs --prove-compile
          node scripts/architect-apps-packaged-worker.mjs --prove-topology
      - name: Record worker bundle and fail-closed commissioned preflight
        env:
          ARCHITECT_APPS_DEPLOYMENT_MODE: commissioned
          APP_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: hosted-publishable-key
        run: |
          node scripts/architect-apps-worker.mjs --bundle-out=/tmp/apps-worker.mjs
          if node scripts/architect-apps-worker-preflight.mjs; then
            echo 'Commissioned preflight must fail closed without worker secrets, isolation and digest.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architect-apps-isolate-evidence
          path: |
            test-results/architect-apps-compiled-preview.html
            docs/evidence/architect-apps/compiled-preview.html
            docs/evidence/architect-apps/worker-image-receipt.json
            docs/evidence/architect-apps/packaged-worker-topology.json
            docs/evidence/architect-apps/runtime-receipt.json
          if-no-files-found: ignore

