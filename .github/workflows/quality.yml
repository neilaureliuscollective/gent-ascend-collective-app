name: Quality gates
on: [push, pull_request]
# Push and PR events for the same source branch verify one current head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install FFmpeg for Studio exports and film renders
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -n 6
      - run: npm ci
      - run: npm run db:ledger
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architect-construct-host-receipts
          path: |
            docs/evidence/architect-construct/host-active-cancel-receipt.json
            docs/evidence/architect-construct/host-isolation-receipt.json
          if-no-files-found: warn
      - run: npx playwright install --with-deps chromium
      - name: Health responsive, ownership and privacy checks
        run: npx playwright test tests/browser/health.spec.ts --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-rendered-evidence
          path: test-results/health-*/health-*.png
          if-no-files-found: ignore
      - name: Founder Office responsive and recovery checks
        run: npx playwright test tests/browser/founder-office.spec.ts --workers=2
      - name: Current Command and identity route contracts
        run: >-
          npx playwright test tests/browser/daily.spec.ts tests/browser/command.spec.ts
          tests/browser/command-living.spec.ts tests/browser/appearance.spec.ts
          tests/browser/brand.spec.ts tests/browser/aethelios-identity.spec.ts
          tests/browser/company-platform.spec.ts tests/browser/public-world.spec.ts
          tests/browser/installed-app.spec.ts tests/browser/estate-journey.spec.ts
          tests/browser/estate-motion.spec.ts tests/browser/direct-home.spec.ts
          tests/browser/orb.spec.ts tests/browser/pilot.spec.ts
          tests/browser/lifestyle-phase-one.spec.ts --workers=2
      - name: Live policy and current commerce regressions
        run: >-
          npx playwright test tests/browser/ascend-mirror.spec.ts
          tests/browser/collection-world.spec.ts tests/browser/commerce-discovery.spec.ts --workers=2
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-evidence
          path: |
            test-results/performance*/**/*.png
            test-results/performance*/**/error-context.md
          if-no-files-found: ignore
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: |
          npx supabase start || {
            echo 'supabase start failed; retrying after stop'
            npx supabase stop --no-backup || true
            sleep 8
            npx supabase start
          }
      - run: npx supabase db reset --local
      - run: node scripts/dev-setup.mjs --running
      - run: npx supabase db advisors --local --type security --level warn --fail-on none
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - name: Real authenticated Founder Office persistence journey
        run: npx playwright test --config playwright.founder.config.ts tests/founder/founder-office.spec.ts
      - run: npm run test:founder
      - if: always()
        run: npx supabase stop --no-backup

