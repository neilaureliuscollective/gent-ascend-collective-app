name: Quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:ledger
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-evidence
          path: |
            test-results/performance*/**/*.png
            test-results/performance*/**/error-context.md
          if-no-files-found: ignore
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase db reset --local
      - run: node scripts/dev-setup.mjs --running
      - run: npx supabase db advisors --local --type security --level warn --fail-on none
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:founder
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: founder-evidence
          path: test-results
          if-no-files-found: ignore
      - if: always()
        run: npx supabase stop --no-backup
