name: Studio live release verification
on:
  push:
    branches: [main, fix/studio-live-verification-20261012]
    paths:
      - 'tests/production/**'
      - 'playwright.production.config.ts'
      - '.github/workflows/studio-live.yml'
  pull_request:
    paths:
      - 'tests/production/**'
      - 'playwright.production.config.ts'
      - '.github/workflows/studio-live.yml'
concurrency:
  group: studio-live-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the real public application and Studio access boundaries
        run: npx playwright test --config playwright.production.config.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-live-public-evidence
          path: test-results
          if-no-files-found: ignore
